<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{utilisateur/base :: layout(~{::main})}">

<main class="login-page">

    <!-- Bloc de présentation -->
    <section class="login-presentation">

        <img th:src="@{/img/logo.png}"
             alt="Logo Seal IA"
             class="login-logo">

        <h1>Bienvenue sur Seal IA</h1>

        <p>
            Retrouve tes conversations et continue
            à échanger avec tes modèles d'intelligence artificielle.
        </p>

        <a th:href="@{/}" class="back-link">
            ← Retour à l'accueil
        </a>

    </section>

    <!-- Bloc de connexion -->
    <section class="login-card">

        <h2>Bon retour !</h2>

        <p class="login-description">
            Connecte-toi à ton compte
        </p>

        <form th:action="@{/connexion}" method="post">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Adresse e-mail
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="prenom.nom@lycee-vinci.fr"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Mot de passe
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="••••••••"
                       required>
            </div>

            <button type="submit" class="btn btn-purple w-100">
                Se connecter
            </button>

        </form>

        <p class="register-link">
            Pas de compte ?
            <a th:href="@{/inscription}">S'inscrire</a>
        </p>

    </section>

</main>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{utilisateur/base :: layout(~{::main})}">

<main class="login-page">

    <div class="login-card">

        <img th:src="@{/img/logo.png}" alt="Logo Seal IA"
             class="login-logo">

        <h1>Bon retour !</h1>

        <p class="login-description">
            Connecte-toi pour discuter avec l'IA
        </p>

        <form th:action="@{/connexion}" method="post">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Adresse e-mail
                </label>

                <input type="email" id="email" name="email"
                       class="form-control"
                       placeholder="prenom.nom@lycee-vinci.fr"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Mot de passe
                </label>

                <input type="password" id="password" name="password"
                       class="form-control"
                       placeholder="••••••••"
                       required>
            </div>

            <button type="button" class="btn btn-purple w-100">
                Se connecter
            </button>

        </form>

        <p class="register-link">
            Pas de compte ? <a href="#">S'inscrire</a>
        </p>

        <a th:href="@{/}" class="back-link">
            ← Retour à l'accueil
        </a>

    </div>

</main>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{utilisateur/base :: layout(~{::main})}">

<main class="login-page">

    <!-- Présentation -->
    <section class="login-presentation">

        <img th:src="@{/img/logo.png}"
             alt="Logo Seal IA"
             class="login-logo">

        <h1>Rejoins Seal IA</h1>

        <p>
            Crée ton compte pour profiter de tes conversations
            avec tes modèles d'intelligence artificielle.
        </p>

        <a th:href="@{/}" class="back-link">
            ← Retour à l'accueil
        </a>

    </section>

    <!-- Formulaire d'inscription -->
    <section class="login-card">

        <h2>Créer un compte</h2>

        <p class="login-description">
            Inscris-toi pour commencer
        </p>

        <form th:action="@{/inscription}" method="post">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Adresse e-mail
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="prenom.nom@lycee-vinci.fr"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Mot de passe
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Choisissez un mot de passe"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="btn btn-purple w-100">
                Créer mon compte
            </button>

        </form>

        <p class="register-link">
            Déjà un compte ?
            <a th:href="@{/connexion}">Se connecter</a>
        </p>

    </section>

</main>
</html>
